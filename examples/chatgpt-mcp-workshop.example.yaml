config_version: 1

control_plane:
  base_url: "https://api.openai.com"
  # Replace with your own Tunnel ID.
  tunnel_id: "<YOUR_TUNNEL_ID>"
  # Keep the actual key outside Git and point to its local file.
  api_key: "file:<ABSOLUTE_PATH_TO_RUNTIME_API_KEY>"

health:
  listen_addr: "127.0.0.1:18020"

admin_ui:
  open_browser: false

log:
  level: info
  format: json

mcp:
  commands:
    - channel: main
      # Computer MCP is the default: files + allowlisted read-only commands.
      # Freeform PowerShell is off unless COMPUTER_MCP_ALLOW_UNRESTRICTED_SHELL=1
      # is set on the process that starts tunnel-client. Do not put that env in this file.
      command: 'node "<ABSOLUTE_PATH_TO_WORKSPACE>/computer-mcp/server.mjs"'

      # File System MCP example: replace the command above with this line.
      # command: 'npx -y @modelcontextprotocol/server-filesystem "<ABSOLUTE_PATH_TO_WORKSPACE>/mcp-demo-files"'

      # Google Stitch example: replace the command above with this line.
      # command: 'node "<ABSOLUTE_PATH_TO_WORKSPACE>/stitch-async-mcp/artifact-server.mjs"'
